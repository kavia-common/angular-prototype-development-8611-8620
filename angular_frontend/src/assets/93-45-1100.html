<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Screen 93 (45:1100)</title>
  <meta name="viewport" content="width=1920, initial-scale=1">
  <link rel="stylesheet" href="./93-45-1100.css">
</head>
<body>
  <!-- Root frame container mapped to JSON root id 45:1100 -->
  <main id="screen-45-1100" class="fig-45-1100-screen" role="main" aria-label="Figma screen 45:1100">
    <!-- Background reference image for pixel checking (hidden by default) -->
    <img class="fig-45-1100-bg" src="assets/figmaimages/figma_image_45_1100.png" alt="" aria-hidden="true">

    <!-- Sidebar (shared system layout based on other screens) -->
    <aside class="fig-sb" aria-label="Sidebar navigation">
      <div class="fig-sb-logo" aria-label="Company logo">
        <!-- Using closest logo from figmaimages for consistency with prior screens -->
        <img src="assets/figmaimages/figma_image_45_1103.png" alt="Company" width="130" height="26">
      </div>
      <hr class="fig-sb-divider" aria-hidden="true">
      <nav class="fig-sb-menu" aria-label="Primary">
        <ul class="fig-sb-list">
          <li class="fig-sb-item">
            <img class="fig-sb-ico" src="assets/figmaimages/figma_image_1_1978.png" width="24" height="24" alt="" aria-hidden="true">
            <a href="#" class="fig-sb-link">Dashboard</a>
          </li>
          <li class="fig-sb-item">
            <img class="fig-sb-ico" src="assets/figmaimages/figma_image_1_1981.png" width="24" height="24" alt="" aria-hidden="true">
            <a href="#" class="fig-sb-link">Devices</a>
          </li>
          <li class="fig-sb-item">
            <img class="fig-sb-ico" src="assets/figmaimages/figma_image_1_2066.png" width="24" height="24" alt="" aria-hidden="true">
            <a href="#" class="fig-sb-link">Analytics</a>
          </li>
          <li class="fig-sb-item">
            <img class="fig-sb-ico" src="assets/figmaimages/figma_image_1_2069.png" width="24" height="24" alt="" aria-hidden="true">
            <a href="#" class="fig-sb-link">Firmware and Apps</a>
          </li>
          <li class="fig-sb-item">
            <img class="fig-sb-ico" src="assets/figmaimages/figma_image_1_2225.png" width="24" height="24" alt="" aria-hidden="true">
            <a href="#" class="fig-sb-link">Users</a>
          </li>
          <li class="fig-sb-item fig-sb-more">
            <img class="fig-sb-ico" src="assets/figmaimages/figma_image_1_2228.png" width="24" height="24" alt="" aria-hidden="true">
            <span class="fig-sb-link" role="button" aria-haspopup="true" aria-expanded="false">More</span>
            <span class="fig-sb-badge" aria-label="4 new">4</span>
            <span class="fig-sb-chevron" aria-hidden="true">▾</span>
          </li>
        </ul>
        <div class="fig-sb-section">
          <a href="#" class="fig-sb-link wide">Config Server</a>
        </div>
        <div class="fig-sb-spacer" aria-hidden="true"></div>
      </nav>
    </aside>

    <!-- Content area -->
    <section class="fig-content" aria-label="Content area">
      <!-- Top App Bar -->
      <header class="fig-topbar">
        <button class="fig-icon-btn" aria-label="Go back">
          <img src="assets/figmaimages/figma_image_1_2378.png" alt="" width="16" height="16" aria-hidden="true">
        </button>

        <div class="fig-tab fig-tab-active">
          <img src="assets/figmaimages/figma_image_1_2381.png" width="24" height="24" alt="" aria-hidden="true">
          <span>Profile</span>
        </div>

        <div class="fig-tab">
          <img src="assets/figmaimages/figma_image_1_2472.png" width="24" height="24" alt="" aria-hidden="true">
          <span>Rules</span>
        </div>

        <div class="fig-search" role="search" aria-label="Search">
          <img src="assets/figmaimages/figma_image_1_2475.png" class="fig-search-icon" alt="" aria-hidden="true" width="16" height="16">
          <input type="text" class="fig-search-input" placeholder="Search for" aria-label="Search for">
        </div>

        <button class="fig-btn fig-btn-primary" disabled aria-disabled="true">Add Rule</button>
      </header>

      <!-- Breadcrumbs and Title -->
      <div class="fig-breadcrumbs">
        <nav aria-label="Breadcrumb">
          <ol class="fig-bc">
            <li><a href="#" aria-current="page">More</a></li>
            <li aria-hidden="true" class="fig-bc-sep">›</li>
            <li><a href="#">Config Server</a></li>
          </ol>
        </nav>
        <h1 class="fig-page-title">Config Server</h1>
      </div>

      <!-- Table header and Empty State -->
      <section class="fig-table" aria-label="Profiles table">
        <div class="fig-table-header">
          <div class="th">Profile Name</div>
          <div class="th">Enter repository URL</div>
          <div class="th">Description</div>
          <div class="th">
            <span>Created Date</span>
            <!-- Using the 45:1100 figma image for the small icon per request -->
            <img class="fig-icon-16" src="assets/figmaimages/figma_image_45_1100.png" width="16" height="16" alt="Filter">
          </div>
          <div class="th"><span>Modified Date</span></div>
          <div class="th">Actions</div>
        </div>
        <div class="fig-table-empty" aria-live="polite">
          Add Profile to add rules
        </div>
      </section>

      <!-- Filters -->
      <div class="fig-filters">
        <button class="fig-select">
          <span>All Partners</span><span class="fig-select-caret" aria-hidden="true">▾</span>
        </button>
        <button class="fig-select">
          <span>All Properties</span><span class="fig-select-caret" aria-hidden="true">▾</span>
        </button>
      </div>

      <!-- User menu -->
      <div class="fig-user" aria-label="User menu">
        <div class="fig-avatar" aria-hidden="true">J</div>
        <div class="fig-user-meta">
          <div class="fig-user-name">John.doe</div>
          <div class="fig-user-role">Super user</div>
        </div>
      </div>
    </section>
  </main>

  <script src="./93-45-1100.js"></script>
</body>
</html>
