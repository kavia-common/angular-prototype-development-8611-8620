<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Screen 89 (1:1978)</title>
  <meta name="viewport" content="width=1920, initial-scale=1">
  <link rel="stylesheet" href="./89-1-1978.css">
</head>
<body>
  <!-- Root frame container mapped to JSON root id 1:1978 -->
  <main id="screen-1-1978" class="ofp-89-screen" role="main" aria-label="Figma screen 1:1978">
    <!-- Background reference image for pixel checking (hidden by default) -->
    <img class="ofp-89-bg" src="assets/figmaimages/figma_image_1_1978.png" alt="" aria-hidden="true">

    <!-- Sidebar (Desktop / Vertical) - inferred from design system across screens -->
    <aside class="ofp-89-sidebar" aria-label="Sidebar navigation">
      <div class="ofp-89-logo" aria-label="Company logo">
        <!-- Closest pair image for logo footprint from figmaimages matching other screens -->
        <img src="assets/figmaimages/figma_image_1_1835.png" alt="Company" width="130" height="26">
      </div>
      <hr class="ofp-89-divider" aria-hidden="true">

      <nav class="ofp-89-menu" aria-label="Primary">
        <ul class="ofp-89-menu-list">
          <!-- Dashboard -->
          <li class="ofp-89-menu-item" data-node-id="1:1979">
            <img class="ofp-89-icon" src="assets/figmaimages/figma_image_1_1978.png" width="24" height="24" alt="" aria-hidden="true">
            <a href="#" class="ofp-89-menu-link">Dashboard</a>
          </li>
          <!-- Devices -->
          <li class="ofp-89-menu-item" data-node-id="1:1981">
            <img class="ofp-89-icon" src="assets/figmaimages/figma_image_1_1981.png" width="24" height="24" alt="" aria-hidden="true">
            <a href="#" class="ofp-89-menu-link">Devices</a>
          </li>
          <!-- Analytics -->
          <li class="ofp-89-menu-item" data-node-id="1:2066">
            <img class="ofp-89-icon" src="assets/figmaimages/figma_image_1_2066.png" width="24" height="24" alt="" aria-hidden="true">
            <a href="#" class="ofp-89-menu-link">Analytics</a>
          </li>
          <!-- Firmware and Apps -->
          <li class="ofp-89-menu-item" data-node-id="1:2069">
            <img class="ofp-89-icon" src="assets/figmaimages/figma_image_1_2069.png" width="24" height="24" alt="" aria-hidden="true">
            <a href="#" class="ofp-89-menu-link">Firmware and Apps</a>
          </li>
          <!-- Users -->
          <li class="ofp-89-menu-item" data-node-id="1:2225">
            <img class="ofp-89-icon" src="assets/figmaimages/figma_image_1_2225.png" width="24" height="24" alt="" aria-hidden="true">
            <a href="#" class="ofp-89-menu-link">Users</a>
          </li>
          <!-- More with Badge -->
          <li class="ofp-89-menu-item ofp-89-menu-more" data-node-id="1:2228">
            <img class="ofp-89-icon" src="assets/figmaimages/figma_image_1_2228.png" width="24" height="24" alt="" aria-hidden="true">
            <span class="ofp-89-menu-link" role="button" aria-haspopup="true" aria-expanded="false">More</span>
            <span class="ofp-89-badge" aria-label="4 new">4</span>
            <span class="ofp-89-chevron" aria-hidden="true">▾</span>
          </li>
        </ul>

        <!-- Section entry consistent with other screens -->
        <div class="ofp-89-menu-section">
          <a href="#" class="ofp-89-menu-link wide">Config Server</a>
        </div>
        <div class="ofp-89-menu-spacer" aria-hidden="true"></div>
      </nav>
    </aside>

    <!-- Content area -->
    <section class="ofp-89-content" aria-label="Content area">
      <!-- Top App Bar -->
      <header class="ofp-89-topbar">
        <!-- Back control icon (use same asset family as other screens) -->
        <button class="ofp-89-icon-btn" aria-label="Go back">
          <img src="assets/figmaimages/figma_image_1_2378.png" alt="" width="16" height="16" aria-hidden="true">
        </button>

        <!-- Tabs -->
        <div class="ofp-89-tab ofp-89-tab-active" data-node-id="1:2381">
          <img src="assets/figmaimages/figma_image_1_2381.png" width="24" height="24" alt="" aria-hidden="true">
          <span>Profile</span>
        </div>
        <div class="ofp-89-tab" data-node-id="1:2472">
          <img src="assets/figmaimages/figma_image_1_2472.png" width="24" height="24" alt="" aria-hidden="true">
          <span>Rules</span>
        </div>

        <!-- Search field -->
        <div class="ofp-89-search" role="search" aria-label="Search">
          <img src="assets/figmaimages/figma_image_1_2475.png" class="ofp-89-search-icon" alt="" aria-hidden="true" width="16" height="16">
          <input type="text" class="ofp-89-search-input" placeholder="Search for" aria-label="Search for">
        </div>

        <!-- Primary button (disabled as per wireframe) -->
        <button class="ofp-89-btn ofp-89-btn-primary" disabled aria-disabled="true">Add Rule</button>
      </header>

      <!-- Breadcrumbs and Title -->
      <div class="ofp-89-breadcrumbs">
        <nav aria-label="Breadcrumb">
          <ol class="ofp-89-bc">
            <li><a href="#" aria-current="page">More</a></li>
            <li aria-hidden="true" class="ofp-89-bc-sep">›</li>
            <li><a href="#">Config Server</a></li>
          </ol>
        </nav>
        <h1 class="ofp-89-page-title">Config Server</h1>
      </div>

      <!-- Table header and Empty State -->
      <section class="ofp-89-table" aria-label="Profiles table">
        <div class="ofp-89-table-header">
          <div class="th">Profile Name</div>
          <div class="th">Enter repository URL</div>
          <div class="th">Description</div>
          <div class="th">
            <span>Created Date</span>
            <img class="ofp-89-icon-16" src="assets/figmaimages/figma_image_45_1100.png" width="16" height="16" alt="Filter">
          </div>
          <div class="th"><span>Modified Date</span></div>
          <div class="th">Actions</div>
        </div>
        <div class="ofp-89-table-empty" aria-live="polite">
          Add Profile to add rules
        </div>
      </section>

      <!-- Right side filters -->
      <div class="ofp-89-filters">
        <button class="ofp-89-select">
          <span>All Partners</span><span class="ofp-89-select-caret" aria-hidden="true">▾</span>
        </button>
        <button class="ofp-89-select">
          <span>All Properties</span><span class="ofp-89-select-caret" aria-hidden="true">▾</span>
        </button>
      </div>

      <!-- User menu (top-right group) -->
      <div class="ofp-89-user" aria-label="User menu">
        <div class="ofp-89-avatar" aria-hidden="true">J</div>
        <div class="ofp-89-user-meta">
          <div class="ofp-89-user-name">John.doe</div>
          <div class="ofp-89-user-role">Super user</div>
        </div>
      </div>
    </section>
  </main>

  <script src="./89-1-1978.js"></script>
</body>
</html>
